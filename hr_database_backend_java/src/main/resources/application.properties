# Quarkus Configuration Properties
quarkus.http.port=8089
quarkus.http.test-port=8089

# Custom properties
hr.database.file-path=data/employees.md
%test.hr.database.file-path=target/test-employees.md

# Log settings
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n
quarkus.log.level=INFO

# OpenAPI / Swagger UI
# quarkus-smallrye-openapi is on the classpath; expose the UI in all profiles
# (by default it is only included in dev mode).
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=HR Database Java Backend
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Galaxium Travels HR Database — Java/Quarkus backend

# CORS — allow all origins (consistent with every other service in the project)
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
