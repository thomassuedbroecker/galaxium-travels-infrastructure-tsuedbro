# docker-compose.java-backend.yaml
# Stack: Java HR backend (port 8089) + Quarkus Java frontend (port 8090)
# Use: ./start-hr-app.sh --backend java
#      ./stop-hr-app.sh  --backend java

services:

  hr_database_backend_java:
    build:
      context: ../hr_database_backend_java
      dockerfile: Dockerfile
    image: hr_database_backend_java:1.0.0
    container_name: hr_database_backend_java
    ports:
      - "8089:8089"
    volumes:
      - ../hr_database_backend_java/data:/app/data
    restart: unless-stopped
    networks:
      hr-java-net:
        # java.net.URI.getHost() returns null for hosts containing underscores,
        # so the service name hr_database_backend_java is unusable as a REST
        # client base URI. This hyphenated alias is what the frontend calls.
        aliases:
          - hr-database-backend-java
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8089/q/health"]
      interval: 5s
      timeout: 5s
      retries: 12

  hr_database_frontend_java:
    build:
      context: .
      dockerfile: Dockerfile
    image: hr_database_frontend_java:1.0.0
    container_name: hr_database_frontend_java
    environment:
      # Resolved at runtime by the REST client. Must use the hyphenated network
      # alias, not the service name — see the alias comment on the backend.
      HR_BACKEND_URL: http://hr-database-backend-java:8089
    ports:
      - "8090:8088"
    depends_on:
      hr_database_backend_java:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - hr-java-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8088/q/health"]
      interval: 5s
      timeout: 5s
      retries: 12

networks:
  hr-java-net:
    driver: bridge
