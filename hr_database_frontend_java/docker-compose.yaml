# docker-compose.yaml
# Stack: Python HR backend (port 8081) + Quarkus Java frontend (port 8090)
# Use: ./start-hr-app.sh --backend python   (default)
#      ./stop-hr-app.sh  --backend python

services:

  hr_database:
    build:
      context: ../HR_database
      dockerfile: Dockerfile
    image: hr_database:1.0.0
    container_name: hr_database
    expose:
      - "8081"
    volumes:
      - ../HR_database/data:/app/data
    restart: unless-stopped
    networks:
      hr-net:
        # java.net.URI.getHost() returns null for hosts containing underscores,
        # so the service name hr_database is unusable as a REST client base URI.
        # This hyphenated alias is what the frontend calls.
        aliases:
          - hr-database
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8081/employees')"]
      interval: 5s
      timeout: 5s
      retries: 12

  hr_database_frontend_java:
    build:
      context: .
      dockerfile: Dockerfile
    image: hr_database_frontend_java:1.0.0
    container_name: hr_database_frontend_java
    environment:
      # Resolved at runtime by the REST client. Must use the hyphenated network
      # alias, not the service name — see the alias comment on the backend.
      HR_BACKEND_URL: http://hr-database:8081
    ports:
      - "8090:8088"
    depends_on:
      hr_database:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - hr-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8088/q/health"]
      interval: 5s
      timeout: 5s
      retries: 12

networks:
  hr-net:
    driver: bridge
