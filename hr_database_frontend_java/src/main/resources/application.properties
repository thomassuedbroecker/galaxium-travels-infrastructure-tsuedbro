# MicroProfile REST Client — HR Database backend URL.
# The configKey matches @RegisterRestClient(configKey = "hrbackend").
# Override HR_BACKEND_URL at runtime to point at a different backend:
#   Java backend   : http://hr-database-backend-java:8089
#   Python backend : http://hr-database:8081
#
# The host MUST NOT contain underscores. java.net.URI.getHost() returns null for
# such hosts, and the REST client then silently falls back to localhost:80.
# The compose files therefore expose hyphenated network aliases for the
# hr_database / hr_database_backend_java services.
quarkus.rest-client.hrbackend.url=${HR_BACKEND_URL:http://localhost:8089}
quarkus.rest-client.hrbackend.scope=jakarta.inject.Singleton

# HTTP port
quarkus.http.port=8088

# CORS
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
