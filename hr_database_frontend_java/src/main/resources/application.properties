# HR Database backend URL.
# This property is NOT set here — it is supplied at image build time via:
#   -Dquarkus.rest-client.hrbackend.url=<url>
# See Dockerfile ARG HR_BACKEND_URL and each docker-compose build.args.
#
# Local dev: run with:  mvn quarkus:dev -Dquarkus.rest-client.hrbackend.url=http://localhost:8089

# HTTP port
quarkus.http.port=8088

# CORS
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
