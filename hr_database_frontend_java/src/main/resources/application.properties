# MicroProfile REST Client — HR Database backend URL.
# The configKey matches @RegisterRestClient(configKey = "hr-api")
# Override HR_API_URL at runtime to point at a different backend.
quarkus.rest-client.hr-api.url=${HR_API_URL:http://localhost:8081}
quarkus.rest-client.hr-api.scope=jakarta.inject.Singleton

# CORS — allow all origins (consistent with every other service in the project)
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
