# Booking MCP server only, without authentication (AUTH_MODE=none).
#
# Usage (from the repository root):
#   bash local-container/booking_system_mcp_no_auth/start.sh
#   bash local-container/booking_system_mcp_no_auth/verify.sh
#   docker compose -f local-container/booking_system_mcp_no_auth/docker_compose.yaml down

name: galaxium-mcp-no-auth

services:
  booking_system_mcp:
    build:
      context: ../../booking_system_mcp
    image: booking_system_mcp:1.0.0
    container_name: booking_system_mcp_no_auth
    ports:
      - ${MCP_HOST_PORT:-8084}:8084
    environment:
      - AUTH_MODE=none
